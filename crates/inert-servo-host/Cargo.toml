# Its own workspace on purpose: Servo's dependency graph (and its unified
# features) stays out of the browser. Build with
#   cargo build --release --manifest-path crates/inert-servo-host/Cargo.toml --target-dir target
# (scripts/build.sh does this) so the binary lands next to inert-browser.
[workspace]

[package]
name = "inert-servo-host"
description = "Out-of-process Servo for the Inert browser: renders unsecured web pages offscreen, speaks JSON lines over stdio, shares frames through a memory-mapped file"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[[bin]]
name = "inert-servo-host"
path = "src/main.rs"

[dependencies]
inert-servo-ipc = { path = "../inert-servo-ipc" }
servo = "0.7"
cookie = "0.18"
dpi = "0.1"
url = "2"
http = "1"
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
dirs = "6"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "prefer-post-quantum"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2
