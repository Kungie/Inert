# Inert website: Caddy serves ./public, and a named Cloudflare Tunnel publishes
# it without opening a port. Tunnel config and credentials live in
# ./cloudflared (see README.md); they are never committed.
services:
  site:
    image: caddy:2-alpine
    volumes:
      - ./public:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.10.4
    # The uid that owns ./cloudflared, so the read-only credentials file is readable.
    user: "1000:1000"
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - site
    restart: unless-stopped
