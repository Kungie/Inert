[workspace]
resolver = "3"
members = [
    "crates/inert-proto",
    "crates/inert-verify",
    "crates/inert-transport",
    "crates/inert-server",
    "crates/inert-browser",
    "examples/bank",
    "examples/shop",
    "examples/notes",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Eren Kahraman"]
rust-version = "1.90"

[workspace.dependencies]
inert-proto = { path = "crates/inert-proto" }
inert-verify = { path = "crates/inert-verify" }
inert-transport = { path = "crates/inert-transport" }
inert-server = { path = "crates/inert-server" }

thiserror = "2"
anyhow = "1"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "prefer-post-quantum"] }
rustls-pki-types = "1"
webpki-roots = "1"
rcgen = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
png = "0.17"
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2
